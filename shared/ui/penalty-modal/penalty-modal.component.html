<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true">
  <div class="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
    
    <!-- En-tête -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-rose-950/20">
      <div class="flex items-center gap-2.5">
        <span class="p-2 rounded-xl bg-rose-500/20 text-rose-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </span>
        <div>
          <h3 class="text-base font-semibold text-slate-100">Prononcer une Sanction</h3>
          <p class="text-xs text-slate-400">Discipline de séance & règlement Njangi</p>
        </div>
      </div>
      <button 
        type="button" 
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-200 transition-colors p-1.5 rounded-lg hover:bg-slate-800"
        aria-label="Fermer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Formulaire Signal Forms pur -->
    <div class="p-6 space-y-4">
      
      <!-- Sélection du membre -->
      <div>
        <label for="sanction-membre" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Membre sanctionné *
        </label>
        <select 
          id="sanction-membre"
          [value]="membreId()"
          (change)="onMembreChange($any($event.target).value)"
          class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
          <option value="">-- Sélectionner un membre --</option>
          @for (m of membres(); track m.id) {
            <option [value]="m.id">{{ m.prenom }} {{ m.nom }} ({{ m.telephone }})</option>
          }
        </select>
      </div>

      <!-- Type d'infraction -->
      <div>
        <label for="sanction-type" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Type de manquement *
        </label>
        <select 
          id="sanction-type"
          [value]="typeInfraction()"
          (change)="onTypeInfractionChange($any($event.target).value)"
          class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
          <option value="RETARD_REUNION">Retard à la réunion (1 000 XAF)</option>
          <option value="BAVARDAGE_SONNERIE">Sonnerie / Bavardage séance (500 XAF)</option>
          <option value="ABSENCE_NON_JUSTIFIEE">Absence non justifiée (5 000 XAF)</option>
          <option value="RETARD_PAIEMENT">Retard de paiement de cotisation (2 000 XAF)</option>
          <option value="NON_RESPECT_REGLE">Non-respect des statuts du groupe (2 500 XAF)</option>
          <option value="AUTRE">Autre infraction</option>
        </select>
      </div>

      <!-- Montant de l'amende -->
      <div>
        <label for="sanction-montant" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Montant de l'amende (XAF) *
        </label>
        <div class="relative">
          <input 
            type="number"
            id="sanction-montant"
            [value]="montantXaf()"
            (input)="onMontantChange($any($event.target).value)"
            min="100"
            step="500"
            class="w-full bg-slate-800 border border-slate-700 text-slate-100 font-semibold text-sm rounded-xl px-3.5 py-2.5 pr-14 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
            placeholder="1000"
          />
          <span class="absolute right-3.5 top-2.5 text-xs font-semibold text-amber-400">XAF</span>
        </div>
      </div>

      <!-- Motif -->
      <div>
        <label for="sanction-motif" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Motif explicite *
        </label>
        <textarea 
          id="sanction-motif"
          [value]="motif()"
          (input)="onMotifChange($any($event.target).value)"
          rows="2"
          class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-3.5 py-2 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all resize-none"
          placeholder="Ex: Arrivée après l'ouverture de séance par le Président">
        </textarea>
      </div>

    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-800 bg-slate-900/80">
      <button 
        type="button" 
        (click)="onClose()"
        class="px-4 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors">
        Annuler
      </button>
      <button 
        type="button" 
        [disabled]="!isValid()"
        (click)="onSubmit()"
        class="px-5 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl shadow-lg shadow-rose-900/30 transition-all">
        Appliquer l'amende
      </button>
    </div>

  </div>
</div>
