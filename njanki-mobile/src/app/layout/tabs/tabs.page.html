<ion-tabs>
  <!-- Bandeau interactif de surveillance réseau et synchronisation 3G/Offline -->
  <app-network-banner></app-network-banner>

  <ion-tab-bar slot="bottom" class="border-t border-slate-800 bg-slate-950/95 backdrop-blur-md">
    <ion-tab-button tab="dashboard" class="text-slate-400 hover:text-emerald-400">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Accueil</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="cotisations" class="text-slate-400 hover:text-emerald-400">
      <ion-icon name="wallet-outline"></ion-icon>
      <ion-label>Cotisations</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="reunions" class="text-slate-400 hover:text-emerald-400">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Séance Live</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="paiements" class="text-slate-400 hover:text-emerald-400">
      <ion-icon name="card-outline"></ion-icon>
      <ion-label>Caisse</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profil" class="text-slate-400 hover:text-emerald-400">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
      @if (tontineState.offlineQueue().length > 0) {
        <ion-badge color="warning">{{ tontineState.offlineQueue().length }}</ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
