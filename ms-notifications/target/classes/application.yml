server:
  port: 8088

spring:
  application:
    name: ms-notifications

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:njangi}
    username: ${DB_USERNAME:njangi_user}
    password: ${DB_PASSWORD:njangi_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notifications
        format_sql: true

  flyway:
    enabled: true
    schemas: notifications
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ms-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Firebase FCM
firebase:
  credentials-file: ${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}
  project-id: ${FIREBASE_PROJECT_ID:njangi-tontine}

logging:
  level:
    com.njangi.notifications: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO
