server:
  port: 9090

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

njangi:
  jwt:
    secret: ${NJANGI_JWT_SECRET:NjangiPlateformeSecreteTresLonguePourHmacSha256Signature2026!}
  services:
    identite-url: ${MS_IDENTITE_URL:lb://ms-identite}
    gouvernance-url: ${MS_GOUVERNANCE_URL:lb://ms-gouvernance}
    finances-url: ${MS_FINANCES_URL:lb://ms-finances}
    engagement-url: ${MS_ENGAGEMENT_URL:lb://ms-engagement}
  cors:
    allow-origins:
      - http://localhost:4000
      - http://127.0.0.1:4000
      - http://localhost:4200
      - http://localhost:8100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.njangi.gateway: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
