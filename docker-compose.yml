    container_name: njangi-ms-groupes
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/njangi?currentSchema=groupes
      SPRING_DATASOURCE_USERNAME: njangi
      SPRING_DATASOURCE_PASSWORD: njangi_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka
    networks:
      - njangi-network

  ms-reunions:
