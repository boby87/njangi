version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: njangi-postgres
    environment:
      POSTGRES_USER: njangi
      POSTGRES_PASSWORD: njangi_secret
      POSTGRES_DB: njangi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    networks:
      - njangi-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: njangi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L622nShTUiT8YgnL3BGwf'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - njangi-network

  eureka-server:
    build: ./eureka-server
    container_name: njangi-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - njangi-network

  api-gateway:
    build: ./api-gateway
    container_name: njangi-gateway
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_AUTH_URL: http://ms-auth:8001
      MS_MEMBRES_URL: http://ms-membres:8002
      MS_GROUPES_URL: http://ms-groupes:8003
      MS_REUNIONS_URL: http://ms-reunions:8004
      MS_COTISATIONS_URL: http://ms-cotisations:8005
      MS_PAIEMENTS_URL: http://ms-paiements:8006
      MS_PENALITES_URL: http://ms-penalites:8007
      MS_NOTIFICATIONS_URL: http://ms-notifications:8008
      MS_STATISTIQUES_URL: http://ms-statistiques:8009
    depends_on:
      - eureka-server
      - ms-auth
      - ms-membres
      - ms-groupes
    networks:
      - njangi-network

  ms-auth:
    build: ./ms-auth
    container_name: njangi-ms-auth
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/njangi?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: njangi
      SPRING_DATASOURCE_PASSWORD: njangi_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka
    networks:
      - njangi-network

  ms-membres:
    build: ./ms-membres
    container_name: njangi-ms-membres
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/njangi?currentSchema=membres
      SPRING_DATASOURCE_USERNAME: njangi
      SPRING_DATASOURCE_PASSWORD: njangi_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka
    networks:
      - njangi-network

  ms-groupes:
