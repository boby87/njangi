      SPRING_DATASOURCE_USERNAME: njangi
      SPRING_DATASOURCE_PASSWORD: njangi_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka
    networks:
      - njangi-network

  ms-paiements:
    build: ./ms-paiements
    container_name: njangi-ms-paiements
    ports:
      - "8006:8006"
    environment:
