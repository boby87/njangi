      - "8005:8005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/njangi?currentSchema=cotisations
      SPRING_DATASOURCE_USERNAME: njangi
      SPRING_DATASOURCE_PASSWORD: njangi_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
