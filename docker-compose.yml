services:
  postgres:
    image: postgres:16-alpine
    container_name: njangi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-njangi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-njangi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-njangi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-njangi} -d ${POSTGRES_DB:-njangi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - njangi-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: njangi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L622nShTUiT8YgnL3BGwf'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - njangi-network

  eureka-server:
    build: ./eureka-server
    container_name: njangi-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - njangi-network

  api-gateway:
    build: ./api-gateway
    container_name: njangi-gateway
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      NJANGI_JWT_SECRET: ${NJANGI_JWT_SECRET:-NjangiPlateformeSecreteTresLonguePourHmacSha256Signature2026!}
      MS_IDENTITE_URL: lb://ms-identite
      MS_GOUVERNANCE_URL: lb://ms-gouvernance
      MS_FINANCES_URL: lb://ms-finances
      MS_ENGAGEMENT_URL: lb://ms-engagement
    depends_on:
      - eureka-server
      - ms-identite
      - ms-gouvernance
      - ms-finances
      - ms-engagement
    networks:
      - njangi-network

  ms-identite:
    build: ./ms-identite
    container_name: njangi-ms-identite
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-njangi}?currentSchema=identite
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-njangi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-njangi_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      NJANGI_JWT_SECRET: ${NJANGI_JWT_SECRET:-NjangiPlateformeSecreteTresLonguePourHmacSha256Signature2026!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      # En production (LuxVps), définir NJANGI_SSO_ALLOW_DEV_FALLBACK=false
      NJANGI_SSO_ALLOW_DEV_FALLBACK: ${NJANGI_SSO_ALLOW_DEV_FALLBACK:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - njangi-network

  ms-gouvernance:
    build: ./ms-gouvernance
    container_name: njangi-ms-gouvernance
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-njangi}?currentSchema=gouvernance
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-njangi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-njangi_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - njangi-network

  ms-finances:
    build: ./ms-finances
    container_name: njangi-ms-finances
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-njangi}?currentSchema=finances
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-njangi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-njangi_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - njangi-network

  ms-engagement:
    build: ./ms-engagement
    container_name: njangi-ms-engagement
    ports:
      - "8004:8004"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-njangi}?currentSchema=engagement
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-njangi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-njangi_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - njangi-network

volumes:
  postgres_data:
  kafka_data:

networks:
  njangi-network:
    driver: bridge
