<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true">
  <div class="relative w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
    
    <!-- En-tête -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-800/50">
      <div class="flex items-center gap-2">
        <span class="p-1.5 rounded-lg bg-amber-500/20 text-amber-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </span>
        <h3 class="text-sm font-semibold text-slate-100">{{ title() }}</h3>
      </div>
      <button 
        type="button" 
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-200 transition-colors p-1 rounded-lg hover:bg-slate-800"
        aria-label="Fermer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Contenu image -->
    <div class="p-5 flex flex-col items-center justify-center min-h-[260px] bg-slate-950/40">
      @if (imageUrl()) {
        <div class="relative group cursor-pointer" (click)="toggleFullscreen()">
          <img 
            [src]="imageUrl()" 
            alt="Preuve reçu signé" 
            class="max-h-80 w-auto rounded-xl border border-slate-700/60 object-contain shadow-md transition-transform duration-200 hover:scale-[1.02]"
          />
          <div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl">
            <span class="text-xs font-medium text-white px-2.5 py-1 rounded bg-black/60 backdrop-blur-sm">Cliquer pour agrandir</span>
          </div>
        </div>
      } @else {
        <div class="flex flex-col items-center gap-3 py-8 text-slate-500">
          <svg class="w-12 h-12 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <p class="text-xs text-slate-400">Aucune pièce jointe ou reçu physique scanné.</p>
        </div>
      }
    </div>

    <!-- Pied de page -->
    <div class="flex items-center justify-between px-5 py-3 border-t border-slate-800 bg-slate-900">
      <span class="text-xs text-slate-400">Règle Njangi : Paiement cash certifié par le Trésorier</span>
      <button 
        type="button" 
        (click)="onClose()"
        class="px-4 py-1.5 text-xs font-medium text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors">
        Fermer
      </button>
    </div>

  </div>
</div>
