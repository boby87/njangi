<header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-4 lg:px-8 flex items-center justify-between sticky top-0 z-40">
  
  <!-- Logo & Identité Cameroun -->
  <div class="flex items-center gap-3">
    <a routerLink="/dashboard" class="flex items-center gap-2.5 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-emerald-500 to-amber-500 p-0.5 shadow-lg shadow-emerald-950/40">
        <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
          <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-amber-400 bg-clip-text text-transparent font-heading">NJ</span>
        </div>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-lg font-extrabold tracking-tight text-white font-heading">NJANGI</span>
          <span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">CMR</span>
        </div>
        <p class="text-[10px] text-slate-400 hidden sm:block font-medium">Gouvernance & Tontines</p>
      </div>
    </a>

    <!-- Séparateur vertical -->
    <div class="h-6 w-px bg-slate-800 hidden md:block mx-2"></div>

    <!-- Sélecteur de Tontine Active -->
    <div class="hidden md:flex items-center gap-2 bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-1.5">
      <span class="text-xs text-slate-400 font-medium">Tontine :</span>
      <select 
        [value]="groupeActif().id"
        (change)="onChangerGroupe($event)"
        class="bg-transparent text-sm font-semibold text-emerald-400 outline-none cursor-pointer pr-2">
        @for (grp of groupes(); track grp.id) {
          <option [value]="grp.id" class="bg-slate-900 text-slate-200">
            {{ grp.nom }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- Droite : Rôle actif, Session active & Profil -->
  <div class="flex items-center gap-3 sm:gap-4">
    
    <!-- Rôle de l'utilisateur dans ce groupe spécifique -->
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400 hidden xl:inline">Mon rôle :</span>
      <app-role-badge [role]="roleActif()" size="md"></app-role-badge>
    </div>

    <!-- Siège du groupe -->
    <div class="hidden lg:flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/60 border border-slate-700/50 text-xs text-slate-300">
      <span class="text-emerald-400">
        @if (groupeActif().typeSiege === 'ROTATIF') {
          🔄 Siège Rotatif
        } @else {
          📍 Siège Fixe
        }
      </span>
    </div>

    <!-- Profil de l'utilisateur -->
    <div class="flex items-center gap-2.5 pl-2 sm:pl-3 border-l border-slate-800">
      <img 
        [src]="utilisateur().avatarUrl" 
        alt="Avatar" 
        class="w-9 h-9 rounded-xl object-cover border border-slate-700 shadow-inner"
      />
      <div class="hidden sm:block text-left">
        <p class="text-xs font-semibold text-slate-200 leading-tight">
          {{ utilisateur().prenom }} {{ utilisateur().nom }}
        </p>
        <p class="text-[11px] text-slate-400 leading-none">
          {{ utilisateur().telephone }}
        </p>
      </div>
    </div>

  </div>
</header>
